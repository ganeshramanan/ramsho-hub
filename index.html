<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsho</title>
<meta name="theme-color" content="#0f3d2a">
<style>
  :root { --bg:#f3f6f4; --card:#fff; --line:#e3e9e5; --text:#0f1a14; --muted:#64736b; --brand:#166534; --shadow:0 1px 2px rgba(15,26,20,.05),0 8px 24px -12px rgba(15,26,20,.18); }
  :root.dark { --bg:#0a0f0c; --card:#121a15; --line:#22302a; --text:#f1f5f2; --muted:#93a39a; --brand:#22a35a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .hero { background:radial-gradient(1200px 400px at 85% -20%,rgba(52,211,153,.35),transparent 60%),linear-gradient(135deg,#0f3d2a,#14532d 55%,#166534); color:#fff; padding:28px 16px 72px; }
  .wrap { max-width:1000px; margin:0 auto; }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; letter-spacing:.01em; }
  .mark { width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-weight:800; }
  .ibtn { height:38px; padding:0 12px; border-radius:10px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.12); color:#fff; font:inherit; font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .ibtn:hover { background:rgba(255,255,255,.2); }
  .ibtn svg { width:16px; height:16px; }
  .tools { display:flex; gap:8px; }
  h1 { font-size:clamp(26px,5vw,38px); line-height:1.15; margin:28px 0 6px; font-weight:750; }
  .lead { margin:0; color:rgba(255,255,255,.78); max-width:560px; }
  .main { max-width:1000px; margin:-44px auto 0; padding:0 16px 48px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; }
  .searchbox { position:relative; }
  .searchbox svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); }
  .search { width:100%; padding:12px 14px 12px 40px; font:inherit; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--text); outline:none; }
  .search:focus { border-color:var(--brand); }
  .chips { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--muted); font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .chip.on { background:var(--brand); border-color:var(--brand); color:#fff; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); margin-top:16px; }
  .card { position:relative; display:flex; flex-direction:column; gap:12px; padding:18px; background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); text-decoration:none; color:inherit; overflow:hidden; transition:transform .18s ease,border-color .18s ease; }
  .card::before { content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--g); }
  .card:hover { transform:translateY(-3px); border-color:var(--c); }
  .top { display:flex; align-items:center; gap:14px; }
  .badge { width:48px; height:48px; border-radius:13px; background:var(--g); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; flex:none; box-shadow:0 8px 16px -8px var(--c); }
  .name { font-weight:700; font-size:18px; line-height:1.2; }
  .tag { display:inline-block; margin-top:3px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--c); }
  .desc { color:var(--muted); font-size:14px; flex:1; }
  .foot { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:12px; border-top:1px solid var(--line); }
  .host { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); min-width:0; }
  .host span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:#cbd5d0; flex:none; }
  .dot.up { background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.2); }
  .dot.wait { background:#f59e0b; animation:p 1s infinite; }
  @keyframes p { 50% { opacity:.35; } }
  .go { display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:14px; color:var(--c); white-space:nowrap; }
  .go svg { width:16px; height:16px; transition:transform .18s ease; }
  .card:hover .go svg { transform:translateX(3px); }
  .empty { display:none; text-align:center; color:var(--muted); padding:40px 0; }
  .note { margin-top:26px; text-align:center; color:var(--muted); font-size:12px; }
  @media (prefers-reduced-motion:reduce) { .card,.go svg { transition:none; } .dot.wait { animation:none; } }
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <div class="bar">
    <div class="logo"><div class="mark" id="mark">R</div><span id="brand">Ramsho</span></div>
    <div class="tools">
      <button class="ibtn" id="wake" title="Pings every app so they are awake before a demo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg><span id="wakeTxt">Wake all</span>
      </button>
      <button class="ibtn" id="theme" aria-label="Switch light or dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
  <h1>Every product,<br>one tap away.</h1>
  <p class="lead" id="lead"></p>
</div></div>

<div class="main">
  <div class="panel">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="search" id="q" type="search" placeholder="Search products   ( press / )" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">No product matches.</p>
  <p class="note">Free apps sleep when idle. Tap <b>Wake all</b> a minute before a demo.</p>
</div>

<script>
// To add a product, add one line to PRODUCTS. To rename the hub, change BRAND.
const BRAND = "Ramsho";
const PRODUCTS = [
  { name:"Grambi",   tag:"For businesses", c:"#7c3aed", g:"linear-gradient(135deg,#8b5cf6,#6d28d9)", url:"https://grambi.in",
    desc:"Social media, content generator, website design, WhatsApp broadcaster, invoice and retention CRM." },
  { name:"Motobill", tag:"For garages",    c:"#2563eb", g:"linear-gradient(135deg,#3b82f6,#1d4ed8)", url:"https://motobill.in",
    desc:"Billing and service software for two-wheeler garages. Live with customers." },
  { name:"Gritbi",   tag:"For students",   c:"#ea580c", g:"linear-gradient(135deg,#fb923c,#ea580c)", url:"https://gritbi-site.onrender.com/",
    desc:"Site for college students and newcomers." },
  { name:"Cartbi",   tag:"For shops",      c:"#0891b2", g:"linear-gradient(135deg,#22d3ee,#0e7490)", url:"https://shopcart-tu3k.onrender.com/login",
    desc:"Shop cart ordering app." },
  { name:"Bot demo", tag:"Demo",           c:"#16a34a", g:"linear-gradient(135deg,#4ade80,#15803d)", url:"https://salavai-laundry-chatbot-demo-1.onrender.com/",
    desc:"WhatsApp chatbot demo for Salavai Laundry." },
  { name:"Illam",    tag:"For homemakers", c:"#be185d", g:"linear-gradient(135deg,#f472b6,#be185d)", url:"https://homemaker-app.onrender.com/",
    desc:"Groceries, budget, calendar and diary for the home." },
];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const host = (u) => u.replace(/^https?:\/\//, "").replace(/\/$/, "");
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
document.title = BRAND; $("brand").textContent = BRAND; $("mark").textContent = BRAND[0];
$("lead").textContent = PRODUCTS.length + " products, built for businesses, garages, students, shops and homes.";

let cat = "All", term = "";
const cats = ["All", ...new Set(PRODUCTS.map((p) => p.tag))];
function chips() {
  $("chips").innerHTML = cats.map((c) => `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach((b) => b.onclick = () => { cat = b.dataset.c; chips(); render(); });
}
function render() {
  const s = term.trim().toLowerCase();
  const list = PRODUCTS.filter((p) => (cat === "All" || p.tag === cat) && (!s || (p.name + " " + p.tag + " " + p.desc).toLowerCase().includes(s)));
  $("grid").innerHTML = list.map((p) => `
    <a class="card" href="${esc(p.url)}" target="_blank" rel="noopener" style="--c:${p.c};--g:${p.g}">
      <div class="top"><div class="badge">${esc(p.name[0])}</div>
        <div><div class="name">${esc(p.name)}</div><span class="tag">${esc(p.tag)}</span></div></div>
      <div class="desc">${esc(p.desc)}</div>
      <div class="foot"><div class="host"><i class="dot ${state[p.url] || ""}" data-u="${esc(p.url)}"></i><span>${esc(host(p.url))}</span></div>
        <span class="go">Open ${ARROW}</span></div>
    </a>`).join("");
  $("empty").style.display = list.length ? "none" : "block";
}
$("q").addEventListener("input", (e) => { term = e.target.value; render(); });
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); } });

// Wake all: a no-cors request to each app starts a sleeping free-tier service.
const state = {};
function mark(u, cls) { state[u] = cls; document.querySelectorAll(".dot").forEach((d) => { if (d.dataset.u === u) d.className = "dot " + cls; }); }
async function wake() {
  const b = $("wake"); b.disabled = true; $("wakeTxt").textContent = "Waking...";
  await Promise.all(PRODUCTS.map(async (p) => {
    mark(p.url, "wait");
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 70000);
    try { await fetch(p.url, { mode:"no-cors", cache:"no-store", signal:ctl.signal }); mark(p.url, "up"); }
    catch { mark(p.url, ""); }
    finally { clearTimeout(t); }
  }));
  $("wakeTxt").textContent = "Wake all"; b.disabled = false;
}
$("wake").onclick = wake;

const root = document.documentElement;
if (localStorage.getItem("hub-theme") === "dark") root.classList.add("dark");
$("theme").onclick = () => { root.classList.toggle("dark"); localStorage.setItem("hub-theme", root.classList.contains("dark") ? "dark" : "light"); };
chips(); render();
</script>
</body>
</html>
